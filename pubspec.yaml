name: budgetbook_2026
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment: 
  sdk: ^3.8.1

dependencies: 
  cupertino_icons: ^1.0.8
  get: 4.7.3
  flutter: 
    sdk: flutter
  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^10.9.1
  lottie: ^3.3.1
  dio: ^5.9.1
  change_app_package_name: ^1.5.0
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.2

dev_dependencies: 
  flutter_lints: ^6.0.0
  flutter_test: 
    sdk: flutter

flutter: 
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/fonts/
    - assets/lotties/

  fonts:
    - family: BalooBhai2
      fonts:
        - asset: assets/fonts/BalooBhai2-Regular.ttf

